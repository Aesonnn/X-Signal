<!doctype html>
<html lang="en" class="h-full bg-black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}X Sentiment Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              xbg: "#000000",
              xpanel: "#111827",
              xmuted: "#94A3B8",
              xaccent: "#22D3EE"
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body class="h-full bg-xbg text-slate-100 antialiased">
    {% block body %}{% endblock %}
  </body>
</html>
