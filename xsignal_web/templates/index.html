{% extends "base.html" %}

{% block title %}X Sentiment Dashboard{% endblock %}

{% block body %}
<div class="h-screen flex flex-col bg-black overflow-hidden">
  <!-- Minimal Header -->
  <header class="flex-none border-b border-slate-800 bg-slate-950/80 px-6 py-4 flex items-center justify-between z-10">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-slate-100">X-Signal</h1>
      <p class="text-xs text-slate-400">Sentiment Analysis Dashboard</p>
    </div>
    <a
      href="/dashboard/"
      class="text-sm font-medium text-cyan-400 hover:text-cyan-300 transition"
      target="_blank"
    >
      Open Fullscreen &nearr;
    </a>
  </header>

  <!-- Full-height Dashboard Embed -->
  <div class="flex-1 w-full bg-black relative">
    <iframe
      src="/dashboard/"
      class="absolute inset-0 w-full h-full border-0"
      title="Sentiment Dashboard"
    ></iframe>
  </div>
</div>
{% endblock %}
