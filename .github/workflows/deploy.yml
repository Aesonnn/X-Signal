name: Deploy to Azure VM

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/${{ secrets.SSH_USER }}/X-Signal"
          overwrite: true

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/X-Signal
            python3 -m venv .venv || true
            source .venv/bin/activate
            pip install -r requirements.txt
            pip install gunicorn
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            chmod 755 /home/${{ secrets.SSH_USER }}
            chmod -R 755 /home/${{ secrets.SSH_USER }}/X-Signal/staticfiles
            sudo systemctl restart xsignal
