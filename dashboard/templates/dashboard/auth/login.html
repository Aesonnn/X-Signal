<!doctype html>
<html lang="en" class="h-full" style="font-size: 120%;">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · X-Signal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full bg-[#FFFFFF] text-[#0F1419] font-sans">
  <main class="min-h-screen flex items-center justify-center px-4">
    <section class="w-full max-w-md rounded-2xl border border-[#EFF3F4] bg-[#F7F9F9] p-6">
      <h1 class="text-2xl font-bold text-[#0F1419]">Sign in</h1>
      <p class="text-sm text-[#536471] mt-1">Access your dashboards</p>

      <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div>
          <label class="block text-sm text-[#536471] mb-1" for="id_username">Username or Email</label>
          <input id="id_username" name="username" type="text" required value="{{ form.username.value|default:'' }}" class="w-full rounded-md border border-[#EFF3F4] bg-[#FFFFFF] px-3 py-2 text-sm text-[#0F1419]" />
        </div>
        <div>
          <label class="block text-sm text-[#536471] mb-1" for="id_password">Password</label>
          <input id="id_password" name="password" type="password" required class="w-full rounded-md border border-[#EFF3F4] bg-[#FFFFFF] px-3 py-2 text-sm text-[#0F1419]" />
        </div>
        <button type="submit" class="w-full rounded-md bg-[#1D9BF0] px-3 py-2 text-sm font-medium text-white">Login</button>
      </form>

      <p class="mt-4 text-sm text-[#536471]">No account? <a class="text-[#1D9BF0]" href="{% url 'signup' %}">Sign up</a></p>
    </section>
  </main>
</body>
</html>
